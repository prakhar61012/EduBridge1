<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3157d5"><title>EduBridge</title>
<style>
:root{--b:#3157d5;--b2:#eef2ff;--ink:#172033;--muted:#687185;--bg:#f5f7fb;--line:#e3e7ef;--green:#138a4a;--red:#d64545;--gold:#f1a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.logo{font-size:25px;font-weight:900;color:var(--b)}.logo span{color:#111}.topright{display:flex;gap:8px}.bell{width:42px;height:42px;border:0;border-radius:50%;background:var(--b2);position:relative}.badge{position:absolute;right:1px;top:0;background:#df3d3d;color:white;border-radius:20px;padding:2px 5px;font-size:10px}.screen{padding:22px 18px 95px}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.welcome{max-width:820px;width:100%;text-align:center}.welcome h1{font-size:50px;margin:10px 0}.welcome p{color:var(--muted);font-size:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.role{border:1px solid var(--line);background:white;border-radius:24px;padding:34px;box-shadow:0 15px 40px #18254a0b}.role:hover{border-color:#aebcf6}.roleicon{font-size:50px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 25px #18254a0a;margin-bottom:16px}.title{display:flex;justify-content:space-between;gap:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d3d8e3;border-radius:12px;background:#fff;outline:none}.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:12px 17px;font-weight:800}.btn.secondary{background:var(--b2);color:var(--b)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--b2);color:var(--b);font-size:12px;font-weight:800}.pill.green{background:#eaf8ef;color:var(--green)}.pill.trial{background:#fff5d8;color:#9a6500}.muted{color:var(--muted)}.profile{display:flex;gap:14px;align-items:center}.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#dbe4ff,#9eb2ff);display:grid;place-items:center;color:#243b9e;font-weight:900;flex:none}.profile h3{margin:0 0 4px}.profile p{margin:2px 0;color:var(--muted);font-size:14px}.stars{color:var(--gold);letter-spacing:2px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30}.navin{max-width:1200px;margin:auto;display:flex}.nav button{flex:1;border:0;background:#fff;padding:11px 5px;color:#687185;font-size:12px}.nav button.active{color:var(--b);font-weight:900}.ico{display:block;font-size:19px;margin-bottom:2px}.notice{padding:13px 14px;border-radius:14px;background:#eef7ff;border:1px solid #cfe2ff;margin:10px 0}.success{background:#effbf3;border-color:#c9efd6}.warning{background:#fff8ed;border-color:#fbd9a6}.empty{text-align:center;padding:42px 20px}.empty .big{font-size:42px}.promo{text-align:center;background:linear-gradient(135deg,#eef2ff,#fff);border:2px solid #c7d2fe;border-radius:20px;padding:22px}.old{text-decoration:line-through;color:#777;font-size:24px}.off{color:#d12d2d;font-weight:900;font-size:14px;vertical-align:super}.price{font-size:40px;font-weight:950;color:var(--b)}.days{display:flex;gap:8px;flex-wrap:wrap}.day,.time{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px}.day{border-radius:999px}.day.sel,.time.sel{background:var(--b);border-color:var(--b);color:#fff}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.chat{height:300px;overflow:auto;background:#f7f8fc;border-radius:15px;padding:14px}.msg{max-width:78%;padding:10px 13px;border-radius:15px;margin:7px 0}.mine{background:var(--b);color:#fff;margin-left:auto}.theirs{background:#fff;border:1px solid var(--line)}.back{background:none;border:0;color:var(--b);font-weight:800;padding:0;margin-bottom:15px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.stat .n{font-size:27px;font-weight:950;margin-top:7px}.stat .l{font-size:12px;color:var(--muted);font-weight:750}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.adminnav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.adminnav button.active{background:var(--b2);color:var(--b);font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}.hidden{display:none!important}.demo{font-size:11px;color:#8a6500;background:#fff5d8;padding:4px 7px;border-radius:999px;font-weight:800}
@media(max-width:760px){
 body{overflow-x:hidden}.app{width:100%;max-width:100%}.top{height:62px;padding:0 10px}.logo{font-size:21px}.topright .btn{padding:9px 10px;font-size:12px}.bell{width:38px;height:38px}
 .roles,.grid2{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.clock{grid-template-columns:1fr 1fr}
 .welcome h1{font-size:35px}.welcome p{font-size:15px}.screen{padding:14px 10px 92px}.card{padding:15px;border-radius:16px}
 .profile{align-items:flex-start}.avatar{width:52px;height:52px}.actions{width:100%}.actions .btn{flex:1;min-width:145px}
 .nav button{font-size:11px;padding:9px 2px}.ico{font-size:17px}.promo .price{font-size:34px}
 table{display:block;overflow-x:auto;white-space:nowrap}.title{flex-direction:column}
 .grid2 .field{min-width:0}.btn.full{width:100%}
}
</style>
</head>
<body><div id="root"></div>
<script>
/* ===================== EDU BRIDGE DEMO =====================
   IMPORTANT:
   This build works immediately as a GitHub Pages demo.
   It uses localStorage if Firebase config is not supplied.
   Add your Firebase Web App config below when ready for
   real persistent cloud registration.
============================================================= */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  projectId:"",
  storageBucket:"",
  messagingSenderId:"",
  appId:""
};
const ADMIN_EMAIL="admin@edubridge.demo";
const DEMO_TEACHERS=[
 {id:"trial-arjun",trial:true,name:"Mr. Arjun Kumar",degree:"M.Sc., B.Ed.",experience:"8 years",rating:4.8,subject:"Mathematics",board:"CBSE",classes:"8–10",active:true,verified:true},
 {id:"trial-neha",trial:true,name:"Ms. Neha Sharma",degree:"M.A., B.Ed.",experience:"6 years",rating:4.7,subject:"English",board:"CBSE",classes:"6–10",active:true,verified:true},
 {id:"trial-rohan",trial:true,name:"Mr. Rohan Singh",degree:"M.Sc., B.Ed.",experience:"10 years",rating:4.9,subject:"Science",board:"CBSE",classes:"7–10",active:true,verified:true}
];
const state={role:null,mode:"login",tab:"home",user:null,profile:null,selectedTeacher:null,adminTab:"overview",searchUnlocked:false};
const root=document.getElementById("root");
let fb=null,db=null,auth=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const initials=n=>n?.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?";
const key=k=>"edubridge_"+k;
function localGet(k,d=[]){try{return JSON.parse(localStorage.getItem(key(k))||JSON.stringify(d))}catch{return d}}
function localSet(k,v){localStorage.setItem(key(k),JSON.stringify(v))}
function realFirebase(){return !!FIREBASE_CONFIG.apiKey&&!!FIREBASE_CONFIG.projectId&&!!FIREBASE_CONFIG.appId}
async function setupFirebase(){
 if(!realFirebase())return false;
 try{
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js");
  const {getAuth,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");
  const {getFirestore}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
  fb=initializeApp(FIREBASE_CONFIG);auth=getAuth(fb);db=getFirestore(fb);
  onAuthStateChanged(auth,async u=>{state.user=u;if(u)await firebaseRoute();else if(!state.user)welcome()});
  return true;
 }catch(e){console.warn("Firebase unavailable; demo mode enabled",e);fb=null;db=null;auth=null;return false}
}
async function firebaseRoute(){
 if(!state.user)return;
 if(state.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){state.role="admin";state.profile={email:state.user.email,role:"admin"};adminDashboard();return}
 const {doc,getDoc}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
 const s=await getDoc(doc(db,"users",state.user.uid));if(!s.exists()){await firebaseLogout();return}
 state.profile=s.data();state.role=state.profile.role;state.role==="teacher"?teacherHome():studentHome();
}
function field(l,id,v="",type="text"){return`<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`}
function genderField(){return`<div class="field"><label>Gender</label><select id="gender"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>`}
function shell(body,active="home"){root.innerHTML=`<div class="app"><header class="top"><div class="logo">Edu<span>Bridge</span></div><div class="topright"><button class="bell" onclick="notifications()">🔔<span class="badge">!</span></button><button class="btn secondary" onclick="logout()">Logout</button></div></header><main class="screen">${body}</main>${state.role!=="admin"?`<nav class="nav"><div class="navin"><button class="${active==="home"?"active":""}" onclick="nav('home')"><span class="ico">⌂</span>Home</button><button class="${active==="leave"?"active":""}" onclick="leavePage()"><span class="ico">🗓</span>Leave</button><button class="${active==="time"?"active":""}" onclick="timePage()"><span class="ico">⏰</span>Time Slot</button><button class="${active==="support"?"active":""}" onclick="supportPage()"><span class="ico">💬</span>${state.role==="teacher"?"Helpline":"Support"}</button></div></nav>`:""}</div>`}
function welcome(){root.innerHTML=`<div class="center"><div class="welcome"><div class="logo">EduBridge</div><h1>The right teacher. Near you.</h1><p>Connect, schedule, learn and grow — in one place.</p><div class="roles"><button class="role" onclick="authScreen('student')"><div class="roleicon">🎓</div><h2>Student</h2><p>Find verified teachers and manage classes.</p></button><button class="role" onclick="authScreen('teacher')"><div class="roleicon">👨‍🏫</div><h2>Teacher</h2><p>Register, get verified and teach students.</p></button></div><p class="muted">Admin uses the same login interface.</p></div></div>`}
function authScreen(role){state.role=role;state.mode="login";root.innerHTML=`<div class="center"><div class="card" style="max-width:600px;width:100%"><button class="back" onclick="welcome()">← Back</button><h2>${role==="student"?"Student":"Teacher"} ${state.mode==="login"?"Login":"Registration"}</h2><div class="field"><label>Email</label><input id="email" type="email" placeholder="Enter email"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password"></div><div id="reg" class="hidden"></div><button class="btn full" id="authBtn" onclick="doAuth()">Login</button><button class="btn secondary full" style="margin-top:9px" onclick="toggleAuth()" id="toggle">New account? Register</button><div class="notice" style="margin-top:12px">Create your account to continue.</div></div></div>`}
function toggleAuth(){state.mode=state.mode==="login"?"register":"login";const r=document.getElementById("reg");if(state.mode==="register"){r.classList.remove("hidden");r.innerHTML=state.role==="student"?`<div class="grid2">${field("Name","name")}${field("Class","className")}${field("Board","board")}${genderField()}${field("School","school")}${field("Pincode","pincode")}</div>`:`<div class="grid2">${field("Name","name")}${field("Board you teach","board")}${field("Age","age","", "number")}${genderField()}</div>`;document.getElementById("authBtn").textContent="Register";document.getElementById("toggle").textContent="Already registered? Login"}else{r.classList.add("hidden");r.innerHTML="";document.getElementById("authBtn").textContent="Login";document.getElementById("toggle").textContent="New account? Register"}}
async function doAuth(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password)return alert("Please enter email and password.");
 if(realFirebase()&&auth){
  try{
   const {createUserWithEmailAndPassword,signInWithEmailAndPassword}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");
   const {doc,setDoc,serverTimestamp}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
   if(state.mode==="login"){await signInWithEmailAndPassword(auth,email,password);return}
   const c=await createUserWithEmailAndPassword(auth,email,password);
   const d={email,role:state.role,name:document.getElementById("name").value.trim(),active:true,createdAt:serverTimestamp()};
   if(state.role==="student")Object.assign(d,{className:document.getElementById("className").value.trim(),board:document.getElementById("board").value.trim(),gender:document.getElementById("gender").value.trim(),school:document.getElementById("school").value.trim(),pincode:document.getElementById("pincode").value.trim()});
   else Object.assign(d,{board:document.getElementById("board").value.trim(),age:Number(document.getElementById("age").value),gender:document.getElementById("gender").value.trim(),verified:false,profileComplete:false,documents:[]});
   await setDoc(doc(db,"users",c.user.uid),d);alert("Registered and saved in Firebase.");return;
  }catch(e){return alert(e.message)}
 }
 // Local demo mode
 if(email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){state.role="admin";state.profile={email,role:"admin"};adminDashboard();return}
 let users=localGet("users",[]);
 if(state.mode==="register"){
  if(users.some(x=>x.email.toLowerCase()===email.toLowerCase()))return alert("Account already exists.");
  const u={id:"local-"+Date.now(),email,role:state.role,name:document.getElementById("name").value.trim(),active:true};
  if(state.role==="student")Object.assign(u,{className:document.getElementById("className").value.trim(),board:document.getElementById("board").value.trim(),gender:document.getElementById("gender").value.trim(),school:document.getElementById("school").value.trim(),pincode:document.getElementById("pincode").value.trim()});
  else Object.assign(u,{board:document.getElementById("board").value.trim(),age:document.getElementById("age").value,gender:document.getElementById("gender").value.trim(),verified:false,profileComplete:false,documents:[]});
  users.push(u);localSet("users",users);state.user=u;state.profile=u;alert("Registered successfully in this demo browser.");state.role==="teacher"?teacherHome():studentHome();
 }else{
  const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase());if(!u)return alert("Account not found in this demo browser. Register first.");state.user=u;state.profile=u;state.role=u.role;state.role==="teacher"?teacherHome():studentHome();
 }
}
async function logout(){if(auth)await firebaseLogout();else{state.user=null;state.profile=null;state.role=null;welcome()}}
async function firebaseLogout(){const {signOut}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");await signOut(auth)}
function nav(x){state.tab=x;if(x==="home")(state.role==="teacher"?teacherHome:studentHome)();else if(x==="leave")leavePage();else if(x==="time")timePage();else supportPage()}
function profileCard(p,t=false){return`<div class="profile"><div class="avatar">${initials(p.name)}</div><div><h3>${esc(p.name)} ${p.trial?'<span class="demo">TRIAL</span>':""}</h3>${t?`<p><span class="stars">${"★".repeat(Math.round(p.rating||0))}${"☆".repeat(5-Math.round(p.rating||0))}</span> ${Number(p.rating||0).toFixed(1)}</p><p>${esc(p.degree||"Qualification pending")} · ${esc(p.experience||"Experience pending")}</p><p>${esc(p.subject||"Subject pending")} · ${esc(p.board||"")}</p><p>Classes ${esc(p.classes||"")}</p>`:`<p>Class ${esc(p.className||"")} · ${esc(p.board||"")}</p><p>${esc(p.school||"")}</p>`}</div></div>`}
function studentHome(){
 if((state.profile?.activeTeacherIds||[]).length){return secondDashboard();}
 const unlocked=!!(state.profile&&state.profile.teacherSearchUnlocked);
 const findCard=unlocked
 ? `<div class="card"><div class="title"><div><h2>Find a Teacher</h2><p class="muted">Your teacher search is unlocked. You can search and connect with teachers anytime.</p></div><span class="pill green">UNLIMITED ACCESS</span></div><button class="btn" style="margin-top:14px" onclick="searchTeachers()">Find Teachers</button></div>`
 : `<div class="card"><div class="title"><div><h2>Find a Teacher</h2><p class="muted">Pay ₹100 once to unlock unlimited access to find teachers.</p></div><span class="pill">₹100</span></div><div class="notice warning"><b>Teacher Search Access</b><br>One ₹100 access payment unlocks unlimited teacher search.</div><button class="btn green full" onclick="unlockTeacherSearch()">Pay ₹100 & Unlock Unlimited Teacher Search</button></div>`;
 shell(`<div class="card"><h1>Hello, ${esc(state.profile.name)} 👋</h1><h3>Today's Schedule</h3><div class="notice">No classes scheduled yet.</div></div>${findCard}<div class="grid2"><div class="card"><h3>Teachers</h3><p class="muted">Your connected teachers.</p><button class="btn secondary" onclick="connections()">View Teachers</button></div><div class="card"><h3>Schedule</h3><p class="muted">Your upcoming classes.</p><button class="btn secondary" onclick="schedule()">Open Schedule</button></div></div>`);
}
function getTeachers(){return [...DEMO_TEACHERS,...localGet("users",[]).filter(x=>x.role==="teacher"&&x.verified&&x.active)]}
function unlockTeacherSearch(){
 const p={...(state.profile||{}),teacherSearchUnlocked:true,teacherSearchFeePaid:100};
 state.profile=p;
 if(state.user){
   let users=localGet("users",[]);
   const i=users.findIndex(x=>x.id===state.user.id);
   if(i>=0){users[i]={...users[i],...p};localSet("users",users);}
 }
 alert("₹100 access payment successful. Unlimited teacher search is now unlocked.");
 studentHome();
}
function searchTeachers(){
 if(!state.profile?.teacherSearchUnlocked){return studentHome();}
 const teachers=getTeachers();shell(`<button class="back" onclick="studentHome()">← Back</button><div class="card"><h2>Teachers available</h2><p class="muted">Trial teachers are marked. Real teachers appear only after registration + verification.</p></div>${teachers.map(t=>`<div class="card">${profileCard(t,true)}<div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="rateTeacher('${t.id}')">⭐ Rate & Comment</button><button class="btn" onclick="connectTeacher('${t.id}')">Get Connected · ₹100</button></div></div>`).join("")}`)}
function connectTeacher(id){state.selectedTeacher=getTeachers().find(x=>x.id===id);const t=state.selectedTeacher;shell(`<button class="back" onclick="searchTeachers()">← Back</button><div class="card">${profileCard(t,true)}<div class="notice">Connection charge: <b>₹100</b></div><div class="chat" id="chat"><div class="msg theirs">Hello! Welcome to EduBridge.</div></div><div class="actions" style="margin-top:10px"><input id="chatin" style="flex:1;padding:12px;border:1px solid var(--line);border-radius:12px" placeholder="Type a message"><button class="btn secondary" onclick="sendChat()">Send</button></div><button class="btn green full" style="margin-top:12px" onclick="acceptTeacher()">Accept Teacher & Continue</button></div>`)}
function sendChat(){const v=document.getElementById("chatin").value.trim();if(!v)return;const c=document.getElementById("chat");c.innerHTML+=`<div class="msg mine">${esc(v)}</div><div class="msg theirs">Thanks! We can discuss the learning plan here.</div>`;document.getElementById("chatin").value=""}
function acceptTeacher(){
 const t=state.selectedTeacher;
 shell(`<div class="card"><h2>Teacher accepted 🎉</h2><div class="promo"><div class="old">₹5,000</div><span class="off">10% OFF</span><div class="price">₹4,500</div><p>Teacher fee / month</p><hr><p><b>+ ₹100</b> EduBridge subscription / student / month</p><h2>Total: ₹4,600</h2></div><button class="btn green full" style="margin-top:14px" onclick="demoPay()">Pay ₹4,600 & Start</button></div>`);
}
function demoPay(){
 const t=state.selectedTeacher;
 let c=localGet("connections",[]);
 const exists=c.some(x=>x.studentId===state.user.id&&x.teacherId===t.id);
 if(!exists)c.push({studentId:state.user.id,teacherId:t.id,teacher:t,active:true,createdAt:new Date().toISOString()});
 localSet("connections",c);
 state.profile={...state.profile,activeTeacherIds:[...new Set([...(state.profile.activeTeacherIds||[]),t.id])]};
 let users=localGet("users",[]);
 const i=users.findIndex(x=>x.id===state.user.id);
 if(i>=0){users[i]={...users[i],activeTeacherIds:state.profile.activeTeacherIds};localSet("users",users);}
 alert("Payment successful. Teacher connected.");
 secondDashboard();
}
function rateTeacher(id){const t=getTeachers().find(x=>x.id===id);shell(`<button class="back" onclick="searchTeachers()">← Back</button><div class="card">${profileCard(t,true)}<div class="field"><label>Rating</label><select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="field"><label>Comment</label><textarea id="comment" rows="5"></textarea></div><button class="btn" onclick="saveRating('${id}')">Submit Rating</button></div>`)}
function saveRating(id){let r=localGet("ratings",[]);r.push({teacherId:id,studentId:state.user.id,rating:Number(document.getElementById("rating").value),comment:document.getElementById("comment").value,createdAt:new Date().toISOString()});localSet("ratings",r);alert("Rating saved.");searchTeachers()}
function secondDashboard(){
 const ids=state.profile?.activeTeacherIds||[];
 const teachers=getTeachers().filter(t=>ids.includes(t.id));
 const teacherCards=teachers.length?teachers.map(t=>`<div class="card">${profileCard(t,true)}<div class="notice success">Today's class: 5:00 PM – 6:00 PM</div></div>`).join(""):`<div class="card empty"><div class="big">👨‍🏫</div><p class="muted">No connected teachers yet.</p></div>`;
 shell(`<div class="card"><h1>HELLO ${esc(state.profile.name).toUpperCase()}, 👋</h1><h3>Today's Schedule</h3><div class="notice success">${teachers.length?`You have ${teachers.length} connected teacher${teachers.length>1?"s":""} today.`:"No classes scheduled yet."}</div></div><div class="card"><h2>Teachers</h2>${teacherCards}</div><div class="card"><h2>Schedule</h2><table><tr><th>Day</th><th>Time</th><th>Class</th></tr><tr><td>Today</td><td>5:00–6:00 PM</td><td>${teachers.length?"Connected teacher":"—"}</td></tr></table></div>`);
}
function connections(){
 const ids=state.profile?.activeTeacherIds||[];
 const all=getTeachers().filter(t=>ids.includes(t.id));
 shell(`<div class="card"><h2>Your Teachers</h2>${all.length?all.map(t=>`<div class="card">${profileCard(t,true)}<div class="notice success">✓ Connected teacher · 1 hour/day · 5 days/week</div></div>`).join(""):`<div class="empty"><div class="big">👨‍🏫</div><p class="muted">No connected teachers yet.</p></div>`}</div>`);
}
function schedule(){shell(`<div class="card"><h2>Schedule</h2><div class="empty"><div class="big">📅</div><p class="muted">Each accepted student is scheduled for 1 hour/day, 5 days/week.</p></div></div>`)}
function leavePage(){shell(`<div class="card"><h2>Leave</h2><p class="muted">The scheduled teacher/student will be notified in the production backend.</p><div class="grid2">${field("Leave Date","ldate","","date")}${field("Duration (days)","dur","1","number")}</div><button class="btn" onclick="alert('Leave saved for this demo.')">Apply Leave</button></div>`,"leave")}
function timePage(){shell(`<div class="card"><h2>Time Slot</h2><p class="muted">Select days and clock slots. Minimum: 1 hour/day × 5 days/week.</p><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<button class="day" onclick="this.classList.toggle('sel')">${d}</button>`).join("")}</div><h3>Clock time slots</h3><div class="clock">${["4:00 PM","5:00 PM","6:00 PM","7:00 PM","8:00 PM","9:00 PM"].map(x=>`<button class="time" onclick="this.classList.toggle('sel')">${x}</button>`).join("")}</div><button class="btn" style="margin-top:15px" onclick="alert('Time slots saved.')">Save Time Slots</button></div>`,"time")}
function supportPage(){shell(`<div class="card"><h2>${state.role==="teacher"?"Teacher Helpline":"Student Support"}</h2><div class="field"><label>Message</label><textarea rows="5" placeholder="Describe your issue"></textarea></div><button class="btn" onclick="alert('Support request submitted.')">Send</button></div>`,"support")}
function notifications(){shell(`<div class="card"><h2>Notifications</h2><div class="notice">📚 Class reminders will appear here.</div><div class="notice">🗓 Leave updates will appear here.</div><div class="notice">📢 Admin announcements will appear here.</div></div>`)}
function teacherHome(){const p=state.profile;shell(p.profileComplete?`<div class="card"><h1>Hello, ${esc(p.name)} 👋</h1><h3>Today's Schedule</h3><div class="notice">No classes scheduled yet.</div></div><div class="grid2"><div class="card"><h3>Students</h3><button class="btn secondary" onclick="teacherStudents()">View Students</button></div><div class="card"><h3>Schedule</h3><button class="btn secondary" onclick="schedule()">Open Schedule</button></div></div><div class="card"><h3>Account</h3><p>${p.verified?'<span class="pill green">✓ Verified</span>':'<span class="pill">Verification pending</span>'}</p><p class="muted">Teacher fee: ₹4,500/month. EduBridge teacher subscription starts at ₹250/month and falls by ₹0.50 per student taught during that month.</p></div>`:`<div class="card"><h2>Teacher verification profile</h2><p class="muted">Upload your qualification documents for Admin verification.</p><div class="grid2">${field("Degree / Qualification","degree")}${field("Teaching Experience","experience")}${field("Subject","subject")}${field("Board","teachBoard",p.board||"")}${field("Classes taught","classes")}</div><div class="field"><label>Essential Documents</label><input id="documents" type="file" multiple accept=".pdf,.jpg,.jpeg,.png"></div><button class="btn" onclick="submitTeacherVerification()">Submit for Admin Verification</button></div>`,"home")}
function submitTeacherVerification(){const files=[...document.getElementById("documents").files].map(f=>({name:f.name,size:f.size,type:f.type}));let users=localGet("users",[]);const i=users.findIndex(x=>x.id===state.user.id);const d={degree:document.getElementById("degree").value.trim(),experience:document.getElementById("experience").value.trim(),subject:document.getElementById("subject").value.trim(),board:document.getElementById("teachBoard").value.trim(),classes:document.getElementById("classes").value.trim(),documents:files,profileComplete:true,verified:false,verificationStatus:"pending"};if(i>=0){users[i]={...users[i],...d};localSet("users",users);state.profile={...state.profile,...d};}alert("Teacher profile submitted. In this demo, Admin can approve it from the Admin dashboard.");teacherHome()}
function teacherStudents(){shell(`<div class="card"><h2>Your Students</h2><div class="empty"><div class="big">🎓</div><p class="muted">Connected students will appear here.</p></div></div>`)}
function adminData(){return localGet("users",[])}
function adminDashboard(){const u=adminData(),teachers=u.filter(x=>x.role==="teacher"),students=u.filter(x=>x.role==="student"),activeT=teachers.filter(x=>x.active!==false).length,activeS=students.filter(x=>x.active!==false).length,verified=teachers.filter(x=>x.verified).length,pending=teachers.filter(x=>!x.verified).length;let body=`<div class="card"><div class="title"><div><h1>Admin Dashboard</h1><p class="muted">Central control room · Demo mode</p></div><span class="pill green">Admin</span></div></div><div class="statgrid"><div class="stat"><div class="l">ACTIVE TEACHERS</div><div class="n">${activeT}</div></div><div class="stat"><div class="l">ACTIVE STUDENTS</div><div class="n">${activeS}</div></div><div class="stat"><div class="l">VERIFIED TEACHERS</div><div class="n">${verified}</div></div><div class="stat"><div class="l">VERIFICATION DUE</div><div class="n">${pending}</div></div><div class="stat"><div class="l">TOTAL PAYMENT RECEIVED</div><div class="n">₹0</div></div><div class="stat"><div class="l">PAYMENT DUE</div><div class="n">₹0</div></div><div class="stat"><div class="l">SALARY DUE</div><div class="n">₹0</div></div><div class="stat"><div class="l">TODAY'S CLASSES</div><div class="n">0</div></div></div><div class="adminnav"><button class="${state.adminTab==="overview"?"active":""}" onclick="adminTab('overview')">Overview</button><button class="${state.adminTab==="teachers"?"active":""}" onclick="adminTab('teachers')">Teachers</button><button class="${state.adminTab==="students"?"active":""}" onclick="adminTab('students')">Students</button><button class="${state.adminTab==="updates"?"active":""}" onclick="adminTab('updates')">Publish Updates</button></div>`;if(state.adminTab==="teachers")body+=adminTeachers(teachers);else if(state.adminTab==="students")body+=adminStudents(students);else if(state.adminTab==="updates")body+=`<div class="card"><h2>Publish Update</h2><div class="field"><label>Title</label><input id="ut"></div><div class="field"><label>Message</label><textarea id="um" rows="5"></textarea></div><button class="btn" onclick="publishUpdate()">Publish Update</button></div>`;else body+=`<div class="card"><h2>Verification</h2><div class="notice ${pending?"warning":"success"}">${pending?pending+" real teacher(s) waiting for verification.":"No pending real teachers."}</div></div>`;shell(body)}
function adminTab(x){state.adminTab=x;adminDashboard()}
function adminTeachers(ts){const all=[...DEMO_TEACHERS,...ts];return`<div class="card"><h2>Teachers</h2><p class="muted">Trial teachers are temporary; real teachers are stored in the demo browser and can be verified here.</p>${all.length?`<table><tr><th>Teacher</th><th>Board</th><th>Status</th><th>Documents</th><th></th></tr>${all.map(t=>`<tr><td><b>${esc(t.name)}</b>${t.trial?' <span class="demo">TRIAL</span>':''}</td><td>${esc(t.board)}</td><td>${t.verified?'<span class="pill green">Verified</span>':'<span class="pill">Pending</span>'}</td><td>${(t.documents||[]).length}</td><td>${t.trial?'<span class="muted">Demo</span>':`<button class="btn secondary" onclick="viewTeacher('${t.id}')">Open</button>`}</td></tr>`).join("")}</table>`:`<div class="empty">No teachers.</div>`}</div>`}
function adminStudents(ss){return`<div class="card"><h2>Students</h2>${ss.length?`<table><tr><th>Name</th><th>Class</th><th>Board</th><th>School</th></tr>${ss.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.board)}</td><td>${esc(s.school)}</td></tr>`).join("")}</table>`:`<div class="empty">No students registered.</div>`}</div>`}
function viewTeacher(id){const t=adminData().find(x=>x.id===id);if(!t)return; shell(`<button class="back" onclick="adminTab('teachers')">← Back</button><div class="card">${profileCard(t,true)}<div class="notice">${t.verified?"✓ Verified":"Verification pending"}</div><h3>Uploaded document information</h3>${(t.documents||[]).length?t.documents.map(d=>`<div class="notice">📄 ${esc(d.name)} · ${esc(d.type||"file")}</div>`).join(""):"<p class='muted'>No documents.</p>"}<div class="actions">${!t.verified?`<button class="btn green" onclick="approveTeacher('${id}')">Approve & Publish</button>`:`<button class="btn red" onclick="unverifyTeacher('${id}')">Suspend</button>`}</div></div>`)}
function approveTeacher(id){let u=adminData();const i=u.findIndex(x=>x.id===id);if(i<0)return;u[i].verified=true;u[i].verificationStatus="approved";u[i].active=true;localSet("users",u);alert("Teacher approved and published.");adminTab("teachers")}
function unverifyTeacher(id){let u=adminData();const i=u.findIndex(x=>x.id===id);if(i<0)return;u[i].verified=false;u[i].verificationStatus="suspended";localSet("users",u);alert("Teacher suspended.");adminTab("teachers")}
function publishUpdate(){const title=document.getElementById("ut").value.trim(),message=document.getElementById("um").value.trim();if(!title||!message)return alert("Fill both fields.");let a=localGet("announcements",[]);a.unshift({title,message,createdAt:new Date().toISOString()});localSet("announcements",a);alert("Update published.");adminDashboard()}
setupFirebase().then(ok=>{if(!ok)welcome()});
Object.assign(window,{welcome,authScreen,toggleAuth,doAuth,logout,nav,studentHome,searchTeachers,connectTeacher,sendChat,acceptTeacher,demoPay,rateTeacher,saveRating,connections,schedule,leavePage,timePage,supportPage,notifications,teacherHome,submitTeacherVerification,teacherStudents,adminDashboard,adminTab,viewTeacher,approveTeacher,unverifyTeacher,publishUpdate});
</script></body></html>
